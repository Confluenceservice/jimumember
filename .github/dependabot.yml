# Dependabot: security alerts are always on for public repos; this adds
# scheduled version-update PRs. CI (test.yml) gates every PR, so a green
# Dependabot PR has already passed check + unit + e2e.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Pacific/Auckland"
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor+patch bumps — keeps the queue reviewable.
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # Majors arrive as individual PRs (stripe/googleapis majors need reading
    # the changelog — see .claude/skills/maintainer/SKILL.md).
    ignore:
      # TypeScript 7 is blocked upstream: @astrojs/check (0.9.10, latest) still
      # peers typescript@"^5.0.0 || ^6.0.0", so `npm ci` fails with ERESOLVE on
      # every TS 7 bump — before any CI step runs. Drop this rule once
      # @astrojs/check widens the range. typescript is a devDependency and the
      # CVE gate builds its SBOM from production deps only, so holding majors
      # back here does not blind the security scan.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
