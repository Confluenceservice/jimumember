name: SBOM

# Publishes a Software Bill of Materials for the dependency tree that ships in
# the container. Unlike a Marketplace app, this one is not distributed as
# software — the SBOM exists as internal supply-chain evidence, the kind an
# audit or an incident retrospective asks for.
#
# This is separate from prioritize-cves.yml, which generates its own SBOM
# inline and throws it away. That one is a gate; this one is an artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # required to upload release assets

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # --omit=dev matches the image, and matches prioritize-cves.yml. The
      # Dockerfile's runner stage copies node_modules from prod-deps, which is
      # `npm ci --omit=dev`, so an SBOM of the full tree would describe an
      # image that is not the one running on Fly.
      - name: Generate SBOMs (production dependencies only)
        run: |
          mkdir -p sbom
          npm sbom --sbom-format cyclonedx --omit=dev > sbom/sbom.cyclonedx.json
          npm sbom --sbom-format spdx      --omit=dev > sbom/sbom.spdx.json

      # No package.json-versus-tag check here, unlike a Marketplace app: this
      # repo's release tags are calendar-based (v2026.07.03) and deliberately
      # unrelated to the package.json version, which stays at 0.1.0 because the
      # package is private and never published.
      - name: Report SBOM contents
        run: |
          components=$(jq '[.components[]] | length' sbom/sbom.cyclonedx.json)
          echo "components: $components (production dependencies only)"

      - name: Attach SBOMs to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env rather than inlined into the script: a tag name is
          # user-supplied text and must never be interpolated into a shell
          # command directly.
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" sbom/*.json --clobber

      - name: Upload SBOMs as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
