name: TEMP kev experiment

# Throwaway. Compares CISA KEV against VulnCheck KEV over a fixed CVE list so
# use-vulncheck-kev can be judged on evidence rather than assumption. Delete
# this file and its branch once the question is answered.
on: pull_request

permissions:
  contents: read

jobs:
  cisa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          printf '%s\n' CVE-2021-44228 CVE-2019-11510 CVE-2026-13697 \
            CVE-2026-14257 CVE-2026-18446 CVE-2026-67314 CVE-2026-69152 \
            CVE-2026-33532 CVE-2026-67213 > cves.txt
      - id: run
        uses: Confluenceservice/cve-prioritizer-action@v1
        with:
          cve-file: cves.txt
          fail-on: none
          use-vulncheck: true
          use-vulncheck-kev: false
          vulncheck-api-key: ${{ secrets.VULNCHECK_API_KEY }}
          nist-api-key: ${{ secrets.NIST_API_KEY }}
      - run: |
          echo "CISA KEV  -> worst=${{ steps.run.outputs.worst-priority }} p1plus=${{ steps.run.outputs.p1-plus-count }} p1=${{ steps.run.outputs.p1-count }}"

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          printf '%s\n' CVE-2021-44228 CVE-2019-11510 CVE-2026-13697 \
            CVE-2026-14257 CVE-2026-18446 CVE-2026-67314 CVE-2026-69152 \
            CVE-2026-33532 CVE-2026-67213 > cves.txt
      - id: run
        uses: Confluenceservice/cve-prioritizer-action@v1
        with:
          cve-file: cves.txt
          fail-on: none
          use-vulncheck: true
          use-vulncheck-kev: true
          vulncheck-api-key: ${{ secrets.VULNCHECK_API_KEY }}
          nist-api-key: ${{ secrets.NIST_API_KEY }}
      - run: |
          echo "VulnCheck KEV -> worst=${{ steps.run.outputs.worst-priority }} p1plus=${{ steps.run.outputs.p1-plus-count }} p1=${{ steps.run.outputs.p1-count }}"
